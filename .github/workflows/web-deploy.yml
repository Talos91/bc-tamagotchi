# Web deploy: every push to main that touches the game builds the web export and puts it live on Vercel.
# preview deploy -> smoke test -> production deploy -> smoke test. Docs: docs/tech/04-deploy.md.
# One secret (Daniele's step): VERCEL_TOKEN. Hold production: repo variable WEB_DEPLOY_PROD = off (preview only).
name: Web deploy

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/build_web.py'
      - 'tools/version.py'
      - 'tools/push-sw.js'
      - 'tools/web_smoke.py'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production after the preview passes'
        type: boolean
        default: true

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: '4.6.1'
  VERCEL_CLI: 'vercel@66.5.0'
  # Not secrets: they name the Vercel team and project (talos-projects00/bc-tamagotchi).
  VERCEL_ORG_ID: team_KT759nF5JjMI1o1sS5V3xcR4
  VERCEL_PROJECT_ID: prj_N4jIo9OBOI6Rd2TNFFQAJkyMFzc6
  PROD_URL: https://bc-tamagotchi.vercel.app
  CANONICAL_URL: https://blackcabin.app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Vercel token present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is missing (docs/tech/04-deploy.md, Daniele's steps)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Godot + web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} + web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          REL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$TPL"
          curl -fsSL -o /tmp/godot.zip "$REL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          # The full templates file is ~1.2 GB; only the web ones are kept (and cached).
          curl -fsSL -o /tmp/tpl.tpz "$REL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/tpl.tpz 'templates/web_*' 'templates/version.txt' -d "$TPL"
          rm -f /tmp/godot.zip /tmp/tpl.tpz
          ls -la ~/godot "$TPL"

      - name: Build the web export
        run: |
          set -euo pipefail
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          python tools/build_web.py --out "$RUNNER_TEMP/web"
          ls -la "$RUNNER_TEMP/web"

      - name: Smoke test (build served locally)
        run: |
          set -euo pipefail
          python -m http.server 8791 --bind 127.0.0.1 --directory "$RUNNER_TEMP/web" >/dev/null 2>&1 &
          sleep 2
          python tools/web_smoke.py http://127.0.0.1:8791 "$RUNNER_TEMP/web" --local

      - name: Deploy preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "$VERCEL_CLI" deploy --yes --token "$VERCEL_TOKEN" --cwd "$RUNNER_TEMP/web" > "$RUNNER_TEMP/preview.out"
          URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/preview.out" | head -1)
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Previews sit behind Vercel Authentication: the check needs the project's "Protection Bypass for
          # Automation" secret (read through the API with VERCEL_TOKEN). Without it the preview is not checked.
          set -o pipefail
          if python tools/web_smoke.py "${{ steps.preview.outputs.url }}" "$RUNNER_TEMP/web" | tee "$RUNNER_TEMP/preview-smoke.txt"; then
            echo "Preview smoke: OK" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'no bypass secret\|no "Protection Bypass' "$RUNNER_TEMP/preview-smoke.txt"; then
            echo "::warning::Preview not checked: add Protection Bypass for Automation in Vercel (docs/tech/04-deploy.md)."
            echo "Preview smoke: skipped (no bypass secret)" >> "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi

      - name: Deploy production
        if: (github.event_name == 'push' && vars.WEB_DEPLOY_PROD != 'off') || (github.event_name == 'workflow_dispatch' && inputs.production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "$VERCEL_CLI" deploy --prod --yes --token "$VERCEL_TOKEN" --cwd "$RUNNER_TEMP/web" > "$RUNNER_TEMP/prod.out"
          sleep 5
          python tools/web_smoke.py "$PROD_URL" "$RUNNER_TEMP/web"
          echo "Production: $PROD_URL ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          if getent hosts blackcabin.app >/dev/null; then
            python tools/web_smoke.py "$CANONICAL_URL" "$RUNNER_TEMP/web"
            echo "Canonical: $CANONICAL_URL OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::blackcabin.app does not resolve yet (domain not registered; docs/tech/04-deploy.md)."
          fi
